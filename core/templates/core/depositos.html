<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <title>Depósitos - Controle de Estoque</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f2f2f2;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px;
        }

        main {
            padding: 30px;
        }

        .botao {
            display: inline-block;
            background-color: #222;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            background-color: white;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #ddd;
        }

        .editar {
            color: blue;
        }

        .excluir {
            color: red;
        }

        .voltar {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>Depósitos</h1>
</header>

<main>

    <a
        href="{% url 'cadastrar_deposito' %}"
        class="botao"
    >
        + Cadastrar Depósito
    </a>

    <table>

        <thead>
            <tr>
                <th>Nome</th>
                <th>Endereço</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody>

            {% for deposito in depositos %}

            <tr>

                <td>
                    {{ deposito.nome }}
                </td>

                <td>
                    {{ deposito.endereco }}
                </td>

                <td>

                    <a
                        href="{% url 'editar_deposito' deposito.id %}"
                        class="editar"
                    >
                        Editar
                    </a>

                    |

                    <a
                        href="{% url 'excluir_deposito' deposito.id %}"
                        class="excluir"
                    >
                        Excluir
                    </a>

                </td>

            </tr>

            {% empty %}

            <tr>
                <td colspan="3">
                    Nenhum depósito cadastrado.
                </td>
            </tr>

            {% endfor %}

        </tbody>

    </table>

    <a
        href="{% url 'inicio' %}"
        class="voltar"
    >
        ← Voltar para o início
    </a>

</main>

</body>

</html>
