<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <title>Nova Movimentação</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px;
        }

        main {
            padding: 30px;
        }

        form {
            background-color: white;
            padding: 25px;
            max-width: 600px;
            border-radius: 8px;
        }

        select,
        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            background-color: #222;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<header>
    <h1>Nova Movimentação</h1>
</header>

<main>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Registrar Movimentação
        </button>

        <a href="{% url 'movimentacoes' %}">
            Cancelar
        </a>

    </form>

</main>

</body>

</html>
