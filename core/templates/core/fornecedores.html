<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fornecedores - Controle de Estoque</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f2f2f2;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px;
        }

        main {
            padding: 30px;
        }

        .botao {
            display: inline-block;
            background-color: #222;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            background-color: white;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #ddd;
        }

        .editar {
            color: blue;
        }

        .excluir {
            color: red;
        }
    </style>
</head>

<body>

<header>
    <h1>Fornecedores</h1>
</header>

<main>

    <a href="{% url 'cadastrar_fornecedor' %}" class="botao">
        + Cadastrar Fornecedor
    </a>

    <table>

        <thead>
            <tr>
                <th>Nome</th>
                <th>Telefone</th>
                <th>E-mail</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody>

            {% for fornecedor in fornecedores %}

            <tr>
                <td>{{ fornecedor.nome }}</td>
                <td>{{ fornecedor.telefone }}</td>
                <td>{{ fornecedor.email }}</td>

                <td>
                    <a
                        href="{% url 'editar_fornecedor' fornecedor.id %}"
                        class="editar"
                    >
                        Editar
                    </a>

                    |

                    <a
                        href="{% url 'excluir_fornecedor' fornecedor.id %}"
                        class="excluir"
                    >
                        Excluir
                    </a>
                </td>
            </tr>

            {% empty %}

            <tr>
                <td colspan="4">
                    Nenhum fornecedor cadastrado.
                </td>
            </tr>

            {% endfor %}

        </tbody>

    </table>

</main>

</body>

</html>
