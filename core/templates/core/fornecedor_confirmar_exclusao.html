<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <title>Excluir Fornecedor</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 40px;
        }

        .caixa {
            background-color: white;
            padding: 30px;
            max-width: 500px;
            margin: auto;
            border-radius: 8px;
        }

        button {
            background-color: red;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
        }

        a {
            margin-left: 10px;
        }
    </style>
</head>

<body>

<div class="caixa">

    <h2>Excluir fornecedor</h2>

    <p>
        Deseja realmente excluir o fornecedor
        <strong>{{ fornecedor.nome }}</strong>?
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Sim, excluir
        </button>

        <a href="{% url 'fornecedores' %}">
            Cancelar
        </a>

    </form>

</div>

</body>

</html>
